<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language - Bright Future Primary School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .language-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            animation: slideIn 0.6s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .language-container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .language-container p {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .language-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .language-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .language-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .language-btn.arabic {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .language-btn.arabic:hover {
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }
        
        .language-btn i {
            font-size: 24px;
        }
        
        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="language-container">
        <h1>🌐 Select Language</h1>
        <p>Choose your preferred language</p>
        
        <div class="language-options">
            <a href="index.html" class="language-btn">
                <i class="fas fa-globe"></i>
                <span>English</span>
            </a>
            <a href="index-ar.html" class="language-btn arabic">
                <i class="fas fa-globe"></i>
                <span>العربية</span>
            </a>
        </div>
        
        <a href="index.html" class="back-link">← Back to School</a>
    </div>
</body>
</html>
